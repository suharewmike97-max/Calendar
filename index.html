<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Календар подій</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@600;700&display=swap">
<style>
:root{--bg:#f3f5ff;--card:#fff;--ink:#1d2144;--mute:#6b7194;--line:#e0e5fa;--pri:#3b5bff;--pri-ink:#fff;--bad:#ff4d3d;--ok:#12a566;--r:20px}
:root[data-t=dark]{--bg:#12142b;--card:#1c1f3d;--ink:#eef0ff;--mute:#9aa0c9;--line:#2c3060;--pri:#7d93ff;--pri-ink:#12142b;--bad:#ff7d6e;--ok:#46d79b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Onest,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:7px 13px;font-weight:500}
button:hover{border-color:var(--pri)}
button.p{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700;box-shadow:0 3px 0 color-mix(in srgb,var(--pri) 65%,#000)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 45%,transparent);outline-offset:1px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:22px 20px 16px;max-width:1200px;margin:auto}
h1{font:700 24px/1.1 Unbounded,Onest,sans-serif;margin:0 auto 0 0}
h1 small{display:block;font:400 14px Onest,sans-serif;color:var(--mute);margin-top:6px;text-transform:capitalize}
main{padding:0 20px 40px;max-width:1200px;margin:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border-radius:99px;padding:5px 14px;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.alert{background:color-mix(in srgb,var(--bad) 12%,var(--card));border:2px solid var(--bad);border-radius:16px;padding:10px 16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;margin-bottom:16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.card.g,.card.y,.card.b{background:color-mix(in srgb,var(--t) 7%,var(--card));border-color:color-mix(in srgb,var(--t) 28%,var(--line))}
.g{--t:#12a566}.y{--t:#ff4d3d}.b{--t:#3b5bff}
.card h2{font:700 15px Unbounded,Onest,sans-serif;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card.g h2::before,.card.y h2::before,.card.b h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--t)}
.it{display:grid;grid-template-columns:1fr;column-gap:12px;align-items:center;width:100%;text-align:left;border:0;border-radius:14px;background:var(--card);box-shadow:inset 5px 0 0 var(--c);padding:10px 12px 10px 17px;margin-bottom:8px;font-weight:400}
.it:has(.dl){grid-template-columns:54px 1fr;padding-left:10px;box-shadow:none;border:2px solid var(--line)}
.it b{font-weight:700}.it small{color:var(--mute)}
.bar{grid-column:1/-1;height:6px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c);border-radius:9px}
.dl{display:flex;flex-direction:column;align-items:center;justify-content:center;width:54px;height:54px;border-radius:14px;grid-row:span 2;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.dl.u{background:color-mix(in srgb,var(--bad) 16%,var(--card));color:var(--bad)}
.dl em{font:700 18px/1 Unbounded,Onest,sans-serif;font-style:normal;margin-bottom:2px}
.empty{color:var(--mute);margin:4px 0}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:12px}.mh h2{font:700 17px Unbounded,Onest,sans-serif;margin:0 auto 0 0;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dn{color:var(--mute);font-size:12px;text-align:center;font-weight:500}
.day{min-height:88px;border:2px solid var(--line);border-radius:12px;padding:4px;overflow:hidden}
.day.o{opacity:.4}.day.t{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,var(--card))}
.day>span{font-size:12px;color:var(--mute)}
.day.t>span{background:var(--pri);color:var(--pri-ink);border-radius:99px;padding:1px 7px;font-weight:700}
.ch{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:1px 5px;margin-top:3px;font-size:11px;font-weight:500;background:var(--c);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch.d{background:none;color:var(--c);border:1.5px dashed var(--c)}
dialog{border:0;border-top:8px solid var(--pri);border-radius:var(--r);background:var(--card);color:var(--ink);width:min(540px,94vw);padding:20px 22px;box-shadow:0 20px 60px #0004}
dialog::backdrop{background:#12142b99}
dialog h2{font:700 18px Unbounded,Onest,sans-serif}
label{display:block;font-size:13px;font-weight:500;color:var(--ink);margin-top:12px}
input,select,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--bg);margin-top:4px}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.hide{display:none!important}
@media(max-width:640px){.cal{gap:3px}.day{min-height:58px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:3px;padding:3px}.day>span{width:100%}.ch{width:9px;height:9px;border-radius:50%;padding:0;margin:0;font-size:0}.ch.d{border-width:2px}.row{grid-template-columns:1fr}h1{font-size:20px}}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}.tools input{flex:1;min-width:220px;margin:0}.tools select{width:auto;margin:0}
</style>
</head>
<body>
<header>
 <h1>Календар подій<small id="dt"></small></h1>
 <button id="bNew" class="p hide">+ Подія</button>
 <button id="bImp" class="hide">Імпорт</button>
 <button id="bExp">Експорт CSV</button>
 <button id="bBell" title="Нагадування">🔔</button>
 <button id="bTheme" title="Тема">◐</button>
 <button id="bAuth">Вхід</button>
 <input type="file" id="file" accept=".csv,.ics" class="hide">
</header>
<main>
 <div class="tools"><input id="q" type="search" placeholder="Пошук за назвою, відповідальним, учасником…"><select id="fs"><option value="">Усі статуси</option><option value="todo">Треба зареєструватись</option><option value="done">Зареєстровані</option><option value="skip">Без участі</option><option value="none">Без статусу</option></select></div>
 <div id="chips" class="chips"></div>
 <div id="alert"></div>
 <div class="grid3">
  <section class="card g"><h2>Тривають зараз</h2><div id="now"></div></section>
  <section class="card y"><h2>Дедлайни реєстрації</h2><div id="dls"></div></section>
  <section class="card b"><h2>Найближчі події</h2><div id="soon"></div></section>
 </div>
 <section class="card">
  <div class="mh"><h2 id="mt"></h2><button id="pv">‹</button><button id="td">Сьогодні</button><button id="nx">›</button></div>
  <div class="cal" id="cal"></div>
 </section>
</main>

<dialog id="dEv"><form method="dialog" id="fEv">
 <h2 id="evH" style="margin:0 0 4px">Подія</h2>
 <label>Назва<input name="title" required></label>
 <div class="row"><label>Категорія<select name="category"></select></label>
 <label>Відповідальний<input name="responsible"></label></div>
 <div class="row"><label>Початок<input type="datetime-local" name="start_at" required></label>
 <label>Кінець<input type="datetime-local" name="end_at"></label></div>
 <label>Дедлайн реєстрації<input type="datetime-local" name="reg_deadline"></label>
 <label>Статус реєстрації<select name="reg_status"><option value="">Не вказано</option><option value="todo">Треба зареєструватись</option><option value="done">Зареєстровані</option><option value="skip">Без участі</option></select></label>
 <label>Посилання<input type="url" name="link" placeholder="https://"></label>
 <label>Учасники<input name="participants" placeholder="Імена через кому"></label>
 <label>Нотатки<textarea name="notes" rows="2"></textarea></label>
 <div class="act"><button type="button" id="evDel" class="hide">Видалити</button><button type="button" id="evX">Закрити</button><button class="p" id="evSave">Зберегти</button></div>
</form></dialog>

<dialog id="dLog"><form id="fLog">
 <h2 style="margin:0">Вхід для адміністратора</h2>
 <label>Email<input name="email" type="email" required></label>
 <label>Пароль<input name="pass" type="password" required></label>
 <p id="logErr" style="color:var(--bad);margin:8px 0 0"></p>
 <div class="act"><button type="button" id="logX">Скасувати</button><button class="p">Увійти</button></div>
</form></dialog>

<script src="config.js"></script>
<script>
// 1) Вставте ключі з Supabase (Project Settings → API). Якщо порожньо — працює демо-режим у браузері.
const CFG=window.CFG||{url:'',key:''}; // ключі беруться з config.js

const CATS={'Конкурси':'#ff5a47','Олімпіади':'#3b5bff','Шкільні заходи':'#12a566','Гранти':'#f29b00','Навчання':'#8b5cf6'};
const ST={todo:'⏳ Треба зареєструватись',done:'✓ Зареєстровані',skip:'Без участі'};
const F=['title','category','start_at','end_at','reg_deadline','reg_status','link','responsible','participants','notes'];
const $=s=>document.querySelector(s);
const demo=!CFG.url;
let ev=[],tok=localStorage.getItem('tok')||'',cat='',cur=new Date(),editId=null;
const isAdm=()=>demo||!!tok;
const col=e=>CATS[e.category]||'#66758f';
const D=s=>s?new Date(s):null;
const fmt=d=>d?d.toLocaleString('uk-UA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const loc=d=>{const z=new Date(d-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,16)};

/* ---------- дані ---------- */
async function api(m,q='',b){
 const r=await fetch(CFG.url+'/rest/v1/events'+q,{method:m,headers:{apikey:CFG.key,Authorization:'Bearer '+(tok||CFG.key),'Content-Type':'application/json',Prefer:'return=minimal'},body:b?JSON.stringify(b):undefined});
 if(r.status==401){tok='';localStorage.removeItem('tok');uiAuth()}
 if(!r.ok)throw new Error(await r.text());
 return m=='GET'?r.json():null}
async function load(){
 try{ev=demo?JSON.parse(localStorage.getItem('ev')||'[]'):await api('GET','?select=*&order=start_at')}catch(e){alert('Помилка завантаження: '+e.message)}
 render()}
const persist=()=>demo&&localStorage.setItem('ev',JSON.stringify(ev));
async function saveEv(o,id){
 if(demo){id?Object.assign(ev.find(x=>x.id==id),o):ev.push({...o,id:Date.now()+Math.random()});persist();return}
 id?await api('PATCH','?id=eq.'+id,o):await api('POST','',o)}
async function delEv(id){demo?(ev=ev.filter(x=>x.id!=id),persist()):await api('DELETE','?id=eq.'+id)}
async function addMany(l){
 if(!l.length)return alert('Подій не знайдено у файлі');
 if(demo){l.forEach(o=>ev.push({...o,id:Date.now()+Math.random()}));persist()}else await api('POST','',l);
 await load();alert('Імпортовано подій: '+l.length)}

/* ---------- відображення ---------- */
const vis=()=>{const q=$('#q').value.trim().toLowerCase(),st=$('#fs').value;return ev.filter(e=>(!cat||e.category==cat)&&(!st||(st=='none'?!e.reg_status:e.reg_status==st))&&(!q||[e.title,e.category,e.responsible,e.participants,e.notes].join(' ').toLowerCase().includes(q)))};
function item(e,extra=''){const b=document.createElement('button');b.className='it';b.style.setProperty('--c',col(e));b.innerHTML=extra+`<b>${esc(e.title)}</b><small>${esc(e.category||'')} · ${fmt(D(e.start_at))}${e.reg_status?' · '+ST[e.reg_status]:''}</small>`;b.onclick=()=>openEv(e);return b}
const fill=(id,arr,msg)=>{const n=$(id);n.replaceChildren(...(arr.length?arr:[Object.assign(document.createElement('p'),{className:'empty',textContent:msg})]))};
function left(d){const ms=d-Date.now(),h=ms/36e5;if(h<1)return'менше години';if(h<24)return Math.floor(h)+' год';return Math.ceil(h/24)+' дн'}
function cd(d){const h=(d-Date.now())/36e5;return h<1?'<em>&lt;1</em>год':h<24?`<em>${Math.floor(h)}</em>год`:`<em>${Math.ceil(h/24)}</em>дн`}
function render(){
 $('#dt').textContent=new Date().toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'});
 const now=Date.now(),L=vis();
 $('#chips').replaceChildren(...['',...Object.keys(CATS)].map(c=>{const b=document.createElement('button');b.className='chip'+(cat==c?' on':'');b.textContent=c||'Усі';if(c)b.style.borderColor=CATS[c];b.onclick=()=>{cat=c;render()};return b}));
 const run=L.filter(e=>{const s=D(e.start_at),f=D(e.end_at)||new Date(+s+36e5);return s<=now&&now<=f});
 fill('#now',run.map(e=>{const s=+D(e.start_at),f=+(D(e.end_at)||s+36e5),x=item(e);x.insertAdjacentHTML('beforeend',`<div class="bar" style="--c:${col(e)}"><i style="width:${Math.min(100,(now-s)/(f-s)*100)}%"></i></div>`);return x}),'Зараз нічого не відбувається');
 const dl=L.filter(e=>e.reg_deadline&&D(e.reg_deadline)>now&&!['done','skip'].includes(e.reg_status)).sort((a,b)=>D(a.reg_deadline)-D(b.reg_deadline));
 fill('#dls',dl.slice(0,6).map(e=>{const d=D(e.reg_deadline),u=d-now<864e5*2;return item({...e,start_at:e.reg_deadline},`<span class="dl${u?' u':''}">${cd(d)}</span>`)}),'Відкритих реєстрацій немає');
 const up=L.filter(e=>D(e.start_at)>now).sort((a,b)=>D(a.start_at)-D(b.start_at));
 fill('#soon',up.slice(0,6).map(e=>item(e)),'Немає запланованих подій');
 const hot=dl.filter(e=>D(e.reg_deadline)-now<864e5*3);
 $('#alert').innerHTML=hot.length?`<div class="alert"><b>Скоро закінчується реєстрація:</b> ${hot.map(e=>`${esc(e.title)} (${left(D(e.reg_deadline))})`).join('; ')}</div>`:'';
 month()}
function month(){
 const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));
 $('#mt').textContent=cur.toLocaleDateString('uk-UA',{month:'long',year:'numeric'});
 const box=$('#cal');box.replaceChildren(...['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(t=>Object.assign(document.createElement('div'),{className:'dn',textContent:t})));
 const L=vis(),today=new Date().toDateString();
 for(let i=0;i<42;i++){
  const d=new Date(start);d.setDate(start.getDate()+i);
  const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),z=new Date(+a+864e5);
  const c=document.createElement('div');c.className='day'+(d.getMonth()!=m?' o':'')+(d.toDateString()==today?' t':'');
  c.innerHTML=`<span>${d.getDate()}</span>`;
  L.forEach(e=>{const s=D(e.start_at),f=D(e.end_at)||s;if(s<z&&f>=a)c.append(chip(e,(e.reg_status=='done'?'✓ ':'')+e.title,''));
   const r=D(e.reg_deadline);if(r&&r>=a&&r<z&&!['done','skip'].includes(e.reg_status))c.append(chip(e,'⏰ '+e.title,'d'))});
  box.append(c)}}
function chip(e,t,k){const b=document.createElement('button');b.className='ch '+k;b.style.setProperty('--c',col(e));b.textContent=t;b.title=t;b.onclick=()=>openEv(e);return b}

/* ---------- форма події ---------- */
const fe=$('#fEv');
fe.category.innerHTML=Object.keys(CATS).map(c=>`<option>${c}</option>`).join('');
function openEv(e){
 editId=e?e.id:null;const adm=isAdm();
 $('#evH').textContent=e?(adm?'Редагування події':e.title):'Нова подія';
 F.forEach(k=>{const el=fe[k];el.disabled=!adm;let v=e?e[k]:'';if(v&&el.type=='datetime-local')v=loc(D(v));el.value=v||''});
 if(!e)fe.start_at.value=loc(new Date());
 $('#evSave').classList.toggle('hide',!adm);$('#evDel').classList.toggle('hide',!(adm&&e));
 $('#dEv').showModal()}
fe.onsubmit=async ev2=>{ev2.preventDefault();
 const o={};F.forEach(k=>{let v=fe[k].value.trim?fe[k].value.trim():fe[k].value;if(fe[k].type=='datetime-local')v=v?new Date(v).toISOString():null;o[k]=v||null});
 try{await saveEv(o,editId);$('#dEv').close();await load()}catch(e){alert('Не вдалося зберегти: '+e.message)}};
$('#evX').onclick=()=>$('#dEv').close();
$('#evDel').onclick=async()=>{if(confirm('Видалити подію?')){try{await delEv(editId);$('#dEv').close();await load()}catch(e){alert(e.message)}}};

/* ---------- вхід ---------- */
function uiAuth(){const a=isAdm();['#bNew','#bImp'].forEach(s=>$(s).classList.toggle('hide',!a));$('#bAuth').classList.toggle('hide',demo);$('#bAuth').textContent=tok?'Вийти':'Вхід'}
$('#bAuth').onclick=()=>{if(tok){tok='';localStorage.removeItem('tok');uiAuth();render()}else $('#dLog').showModal()};
$('#logX').onclick=()=>$('#dLog').close();
$('#fLog').onsubmit=async e=>{e.preventDefault();$('#logErr').textContent='';
 try{const r=await fetch(CFG.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify({email:e.target.email.value,password:e.target.pass.value})});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Невірний email або пароль');
  tok=j.access_token;localStorage.setItem('tok',tok);$('#dLog').close();uiAuth();render()}catch(x){$('#logErr').textContent=x.message}};

/* ---------- імпорт / експорт ---------- */
function csv(t){const rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}
  else if(ch=='"')q=true;else if(ch==','||ch==';'){r.push(c);c=''}
  else if(ch=='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!='\r')c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}
 const h=rows.shift().map(x=>x.trim().replace(/^\uFEFF/,''));
 return rows.filter(r=>r.some(x=>x.trim())).map(r=>{const o={};F.forEach(k=>{const i=h.indexOf(k);let v=i>=0?(r[i]||'').trim():'';if(v&&/_at$|deadline/.test(k)){const d=new Date(v);v=isNaN(d)?null:d.toISOString()}o[k]=v||null});if(!CATS[o.category])o.category='Шкільні заходи';if(!ST[o.reg_status])o.reg_status=null;return o}).filter(o=>o.title&&o.start_at)}
function ics(t){
 t=t.replace(/\r?\n[ \t]/g,'');
 const pd=v=>{const m=(v||'').match(/(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)(Z)?)?/);if(!m)return null;return(m[7]?new Date(Date.UTC(m[1],m[2]-1,m[3],m[4],m[5],m[6])):new Date(m[1],m[2]-1,m[3],m[4]||0,m[5]||0)).toISOString()};
 return t.split('BEGIN:VEVENT').slice(1).map(b=>{const g=k=>{const m=b.match(new RegExp('^'+k+'[^:\\n]*:(.*)$','m'));return m?m[1].trim().replace(/\\,/g,',').replace(/\\n/g,' '):''};
  return{title:g('SUMMARY'),category:'Шкільні заходи',start_at:pd(g('DTSTART')),end_at:pd(g('DTEND')),reg_deadline:null,link:g('URL')||null,responsible:null,participants:null,notes:g('DESCRIPTION')||null}}).filter(o=>o.title&&o.start_at)}
$('#bImp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();
 try{await addMany(/\.ics$/i.test(f.name)?ics(t):csv(t))}catch(x){alert('Помилка імпорту: '+x.message)}e.target.value=''};
$('#bExp').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const t='\uFEFF'+F.join(',')+'\n'+vis().map(e=>F.map(k=>q(e[k])).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='events.csv';a.click()};

/* ---------- інше ---------- */
$('#bNew').onclick=()=>openEv(null);
$('#pv').onclick=()=>{cur.setMonth(cur.getMonth()-1);month()};
$('#nx').onclick=()=>{cur.setMonth(cur.getMonth()+1);month()};
$('#td').onclick=()=>{cur=new Date();month()};
const root=document.documentElement;
root.dataset.t=localStorage.getItem('t')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
$('#bTheme').onclick=()=>{root.dataset.t=root.dataset.t=='dark'?'light':'dark';localStorage.setItem('t',root.dataset.t)};
function notify(){if(!('Notification'in window)||Notification.permission!='granted')return;
 const k='n'+new Date().toDateString();if(localStorage.getItem(k))return;
 const hot=ev.filter(e=>e.reg_deadline&&D(e.reg_deadline)>Date.now()&&D(e.reg_deadline)-Date.now()<864e5);
 if(hot.length){new Notification('Дедлайн реєстрації за добу',{body:hot.map(e=>e.title).join(', ')});localStorage.setItem(k,1)}}
$('#bBell').onclick=async()=>{if(!('Notification'in window))return alert('Браузер не підтримує сповіщення');
 const p=await Notification.requestPermission();alert(p=='granted'?'Нагадування увімкнено: сповіщення про дедлайни за добу з’являться, коли відкриєте календар.':'Сповіщення вимкнені в браузері');notify()};
$('#q').oninput=render;$('#fs').onchange=render;
uiAuth();load().then(notify);setInterval(render,6e4);
</script>
